{% extends 'core/base.html' %}

{% block title %}Sign Up - Food Rescue{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-6">
        <div class="card shadow border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-primary text-white py-3 text-center">
                <h4 class="fw-bold mb-0">Join the Movement</h4>
            </div>
            <div class="card-body p-4 p-md-5 bg-white">
                <p class="text-muted text-center mb-4">Create your account to start donating or claiming food.</p>
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-3 shadow-sm">Create Account</button>
                </form>
                <div class="text-center mt-4">
                    <small class="text-muted">Already have an account? <a href="{% url 'login' %}" class="text-primary fw-bold">Login here</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    /* Quick CSS to make the default Django form look better with Bootstrap */
    form p label { font-weight: bold; display: block; margin-bottom: 5px; color: #444; }
    form p input, form p select { 
        width: 100%; 
        padding: 8px 12px; 
        border: 1px solid #ced4da; 
        border-radius: 6px; 
        margin-bottom: 15px;
    }
</style>
{% endblock %}
