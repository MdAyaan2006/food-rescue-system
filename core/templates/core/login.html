{% extends 'core/base.html' %}

{% block title %}Login - Food Rescue{% endblock %}

{% block content %}
<div class="row justify-content-center mt-5">
    <div class="col-md-5">
        <div class="card shadow border-0 rounded-4 overflow-hidden">
            <div class="card-header bg-dark text-white py-3 text-center">
                <h4 class="fw-bold mb-0">Welcome Back</h4>
            </div>
            <div class="card-body p-4 p-md-5 bg-white">
                <form method="post">
                    {% csrf_token %}
                    {{ form.as_p }}
                    <button type="submit" class="btn btn-primary btn-lg w-100 fw-bold mt-3 shadow-sm">Login</button>
                </form>
                <div class="text-center mt-4">
                    <small class="text-muted">New here? <a href="{% url 'signup' %}" class="text-primary fw-bold">Create an account</a></small>
                </div>
            </div>
        </div>
    </div>
</div>

<style>
    form p label { font-weight: bold; display: block; margin-bottom: 5px; color: #444; }
    form p input { 
        width: 100%; 
        padding: 8px 12px; 
        border: 1px solid #ced4da; 
        border-radius: 6px; 
        margin-bottom: 15px;
    }
</style>
{% endblock %}
